openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GPay Market to Digiseller synchronization API
servers:
  - url: /api
tags:
  - name: health
  - name: dashboard
  - name: products
  - name: sync
  - name: settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Synchronization overview
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [all, available, unavailable, published, draft]
        - name: productKind
          in: query
          schema:
            type: string
            enum: [all, key, gift, unknown]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Cached GPay products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /products/{id}/publish:
    post:
      operationId: publishProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product publication result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          description: Product cannot be published
  /products/publish-batch:
    post:
      operationId: publishProductsBatch
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchPublishInput"
      responses:
        "200":
          description: Batch publication result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPublishResult"
  /sync/catalog:
    post:
      operationId: syncCatalog
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSyncInput"
      responses:
        "200":
          description: Catalog synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "502":
          description: GPay API unavailable
  /activities:
    get:
      operationId: listActivities
      tags: [dashboard]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Recent synchronization events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: Pricing and safety settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /connections:
    get:
      operationId: getConnections
      tags: [settings]
      responses:
        "200":
          description: External API connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connections"
  /connections/test:
    post:
      operationId: testConnections
      tags: [settings]
      responses:
        "200":
          description: Live connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connections"
  /exchange-rate:
    get:
      operationId: getExchangeRate
      tags: [dashboard]
      summary: Current official USD to RUB rate
      responses:
        "200":
          description: Latest official exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Dashboard:
      type: object
      required: [totalProducts, availableProducts, publishedProducts, averageMargin, potentialRevenue, lastSyncAt, automationMode]
      properties:
        totalProducts: { type: integer }
        availableProducts: { type: integer }
        publishedProducts: { type: integer }
        averageMargin: { type: number }
        potentialRevenue: { type: number }
        lastSyncAt: { type: [string, "null"], format: date-time }
        automationMode: { type: string, enum: [manual, automatic] }
    Product:
      type: object
      required: [id, gpayId, name, imageUrl, digisellerImageUploaded, productType, productKind, supplierPriceUsd, salePriceRub, marginPercent, isAvailable, publicationStatus, region, updatedAt]
      properties:
        id: { type: integer }
        gpayId: { type: integer }
        digisellerId: { type: [integer, "null"] }
        appId: { type: [integer, "null"] }
        subId: { type: [integer, "null"] }
        name: { type: string }
        imageUrl: { type: [string, "null"] }
        digisellerImageUploaded: { type: boolean }
        productType: { type: string }
        productKind: { type: string, enum: [key, gift, unknown] }
        supplierPriceUsd: { type: number }
        salePriceRub: { type: number }
        marginPercent: { type: number }
        profitRub: { type: number }
        isAvailable: { type: boolean }
        publicationStatus: { type: string, enum: [draft, published, paused, error] }
        region: { type: string }
        warningMessage: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    ProductUpdate:
      type: object
      properties:
        marginPercent: { type: number, minimum: 0, maximum: 500 }
        publicationStatus: { type: string, enum: [draft, published, paused] }
    BatchPublishInput:
      type: object
      required: [productIds]
      properties:
        productIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    BatchPublishItem:
      type: object
      required: [productId, name, status, imageStatus]
      properties:
        productId: { type: integer }
        name: { type: string }
        status: { type: string, enum: [published, failed] }
        digisellerId: { type: [integer, "null"] }
        imageStatus: { type: string, enum: [uploaded, skipped, failed] }
        error: { type: [string, "null"] }
    BatchPublishResult:
      type: object
      required: [requested, succeeded, failed, items]
      properties:
        requested: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/BatchPublishItem" }
    CatalogSyncInput:
      type: object
      required: [pageSize]
      properties:
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 100 }
        availableOnly: { type: boolean, default: true }
        productKind: { type: string, enum: [all, key, gift], default: all }
    SyncResult:
      type: object
      required: [success, imported, updated, disabled, message, completedAt]
      properties:
        success: { type: boolean }
        imported: { type: integer }
        updated: { type: integer }
        disabled: { type: integer }
        productKind: { type: string, enum: [all, key, gift] }
        message: { type: string }
        completedAt: { type: string, format: date-time }
    Activity:
      type: object
      required: [id, type, title, description, status, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [sync, price, publish, connection] }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [success, warning, error] }
        createdAt: { type: string, format: date-time }
    Settings:
      type: object
      required: [defaultMarginPercent, usdRubRate, exchangeRateMode, conversionMarkupPercent, digisellerFeePercent, fixedReserveRub, minimumProfitRub, automationMode, disableOnUnavailable, credentialsConfigured]
      properties:
        defaultMarginPercent: { type: number }
        usdRubRate: { type: number }
        exchangeRateMode: { type: string, enum: [cbr, manual] }
        conversionMarkupPercent: { type: number }
        digisellerFeePercent: { type: number }
        fixedReserveRub: { type: number }
        minimumProfitRub: { type: number }
        automationMode: { type: string, enum: [manual, automatic] }
        disableOnUnavailable: { type: boolean }
        credentialsConfigured: { type: boolean }
    SettingsInput:
      type: object
      required: [defaultMarginPercent, usdRubRate, exchangeRateMode, conversionMarkupPercent, digisellerFeePercent, fixedReserveRub, minimumProfitRub, automationMode, disableOnUnavailable]
      properties:
        defaultMarginPercent: { type: number, minimum: 0, maximum: 500 }
        usdRubRate: { type: number, exclusiveMinimum: 0 }
        exchangeRateMode: { type: string, enum: [cbr, manual] }
        conversionMarkupPercent: { type: number, minimum: 0, maximum: 20 }
        digisellerFeePercent: { type: number, minimum: 0, maximum: 100 }
        fixedReserveRub: { type: number, minimum: 0 }
        minimumProfitRub: { type: number, minimum: 0 }
        automationMode: { type: string, enum: [manual, automatic] }
        disableOnUnavailable: { type: boolean }
    ConnectionState:
      type: object
      required: [configured, healthy, label, detail]
      properties:
        configured: { type: boolean }
        healthy: { type: boolean }
        label: { type: string }
        detail: { type: string }
    Connections:
      type: object
      required: [gpay, digiseller, checkedAt]
      properties:
        gpay: { $ref: "#/components/schemas/ConnectionState" }
        digiseller: { $ref: "#/components/schemas/ConnectionState" }
        checkedAt: { type: string, format: date-time }
    ExchangeRate:
      type: object
      required: [usdRub, conversionMarkupPercent, purchaseRate, source, effectiveDate, fetchedAt, isFallback]
      properties:
        usdRub: { type: number }
        conversionMarkupPercent: { type: number }
        purchaseRate: { type: number }
        source: { type: string }
        effectiveDate: { type: string }
        fetchedAt: { type: string, format: date-time }
        isFallback: { type: boolean }