openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GPay Market to Digiseller synchronization API
servers:
  - url: /api
tags:
  - name: health
  - name: dashboard
  - name: products
  - name: sync
  - name: settings
  - name: orders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /notifications/test:
    post:
      operationId: testNotifications
      tags: [settings]
      responses:
        "200":
          description: Test notification was delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTestResult"
  /notifications:
    delete:
      operationId: disableNotifications
      tags: [settings]
      responses:
        "200":
          description: Notification channel was disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTestResult"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Synchronization overview
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [all, available, unavailable, published, draft]
        - name: productKind
          in: query
          schema:
            type: string
            enum: [all, key, gift, unknown]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Cached GPay products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /products/bulk-margin:
    post:
      operationId: updateProductsMargin
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductsMarginUpdate"
      responses:
        "200":
          description: Margin and calculated prices updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsMarginUpdateResult"
  /products/bulk-margin-summary:
    get:
      operationId: getProductsMarginSummary
      tags: [products]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [all, available, unavailable, published, draft]
        - name: productKind
          in: query
          schema:
            type: string
            enum: [all, key, gift, unknown]
      responses:
        "200":
          description: Exact number of products affected by the current filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsMarginSummary"
  /products/{id}/publish:
    post:
      operationId: publishProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishProductInput"
      responses:
        "200":
          description: Product publication result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "409":
          description: Product cannot be published
  /products/publish-batch:
    post:
      operationId: publishProductsBatch
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchPublishInput"
      responses:
        "202":
          description: Batch publication task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPublishTask"
    get:
      operationId: getLatestPublishProductsBatch
      tags: [products]
      responses:
        "200":
          description: Latest batch publication task
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BatchPublishTask"
                  - type: "null"
  /products/publish-batch/{taskId}:
    get:
      operationId: getPublishProductsBatch
      tags: [products]
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Batch publication task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPublishTask"
        "404":
          description: Publication task not found
  /sync/catalog:
    post:
      operationId: syncCatalog
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogSyncInput"
      responses:
        "200":
          description: Catalog synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "502":
          description: GPay API unavailable
  /sync/digiseller-products:
    get:
      operationId: listDigisellerProducts
      tags: [sync]
      responses:
        "200":
          description: Products from the authenticated Digiseller seller account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigisellerProductList"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Digiseller API unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /sync/digiseller-products/link:
    post:
      operationId: linkDigisellerProduct
      tags: [sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DigisellerProductLinkInput"
      responses:
        "200":
          description: Local product linked to an existing Digiseller product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid link input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Local or Digiseller product not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Digiseller product is already linked elsewhere
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "502":
          description: Digiseller API unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /activities:
    get:
      operationId: listActivities
      tags: [dashboard]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Recent synchronization events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: Pricing and safety settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsApplyInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /settings/preview:
    post:
      operationId: previewSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Impact preview for pricing settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPreview"
  /settings/image-provider:
    put:
      operationId: updateImageProviderSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageProviderSettingsInput"
      responses:
        "200":
          description: Updated image provider settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageProviderSettings"
  /autonomous/preflight:
    get:
      operationId: getAutonomousPreflight
      tags: [settings]
      responses:
        "200":
          description: Controlled autonomous launch preflight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomousPreflight" }
  /autonomous/allowlist:
    put:
      operationId: updateAutonomousAllowlist
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomousAllowlistInput" }
      responses:
        "200":
          description: Updated allowlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomousAllowlist" }
  /autonomous/pause:
    post:
      operationId: setAutonomousPause
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomousPauseInput" }
      responses:
        "200":
          description: Emergency pause state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomousPause" }
  /autonomous/order-confirmation:
    post:
      operationId: confirmAutonomousOrder
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomousOrderConfirmationInput" }
      responses:
        "200":
          description: Operator confirmation recorded without buyer data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomousOrderConfirmation" }
  /connections:
    get:
      operationId: getConnections
      tags: [settings]
      responses:
        "200":
          description: External API connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connections"
  /connections/test:
    post:
      operationId: testConnections
      tags: [settings]
      responses:
        "200":
          description: Live connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connections"
  /exchange-rate:
    get:
      operationId: getExchangeRate
      tags: [dashboard]
      summary: Current official USD to RUB rate
      responses:
        "200":
          description: Latest official exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, new, processing, delivered]
            default: all
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Manual fulfillment orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
  /orders/sync:
    post:
      operationId: syncOrders
      tags: [orders]
      responses:
        "200":
          description: Latest Digiseller sales synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSyncResult"
        "502":
          description: Digiseller API unavailable
  /orders/{invoiceId}:
    patch:
      operationId: updateOrder
      tags: [orders]
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
        "409":
          description: Explicit confirmation is required to fulfill a returned order
  /orders/{invoiceId}/public-link:
    post:
      operationId: createOrderPublicLink
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderPublicLinkInput"
      responses:
        "200":
          description: Public order link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPublicLink" }
  /orders/{invoiceId}/gpay-reconcile:
    post:
      operationId: reconcileOrderGPayPurchase
      tags: [orders]
      parameters:
        - in: path
          name: invoiceId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GPayReconciliationInput" }
      responses:
        "200":
          description: Reconciled order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          description: Order not found
        "409":
          description: Purchase is not unknown or identifiers do not match
        "502":
          description: GPay status could not be checked
  /public/orders/access:
    post:
      operationId: accessPublicOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicOrderAccessInput"
      responses:
        "200":
          description: Verified public order link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPublicLink" }
        "404":
          description: Order or code not found
        "502":
          description: Digiseller verification unavailable
  /public/orders/{token}:
    get:
      operationId: getPublicOrder
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 32, maxLength: 200 }
      responses:
        "200":
          description: Public order data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicOrder" }
    post:
      operationId: submitPublicOrderCode
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 32, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicOrderCodeInput"
      responses:
        "200":
          description: Code accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted, alreadySubmitted]
                properties:
                  accepted: { type: boolean }
                  alreadySubmitted: { type: boolean }
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ProductsMarginUpdate:
      type: object
      required: [marginPercent]
      properties:
        productIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        filter:
          $ref: "#/components/schemas/ProductFilter"
        marginPercent: { type: number, minimum: 0, maximum: 500 }
    ProductFilter:
      type: object
      properties:
        search: { type: string }
        status:
          type: string
          enum: [all, available, unavailable, published, draft]
        productKind:
          type: string
          enum: [all, key, gift, unknown]
    ProductsMarginSummary:
      type: object
      required: [total, published]
      properties:
        total: { type: integer, minimum: 0 }
        published: { type: integer, minimum: 0 }
    ProductsMarginUpdateResult:
      type: object
      required: [updated, publishedUpdated, marginPercent]
      properties:
        updated: { type: integer, minimum: 0 }
        publishedUpdated: { type: integer, minimum: 0 }
        marginPercent: { type: number }
    PublicOrderAccessInput:
      type: object
      required: [invoiceId, code]
      properties:
        invoiceId: { type: string, minLength: 1, maxLength: 200 }
        code: { type: string, pattern: '^\d{16}$' }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Dashboard:
      type: object
      required: [totalProducts, availableProducts, publishedProducts, averageMargin, potentialRevenue, lastSyncAt, automationMode, priceTimeoutWarning]
      properties:
        totalProducts: { type: integer }
        availableProducts: { type: integer }
        publishedProducts: { type: integer }
        averageMargin: { type: number }
        potentialRevenue: { type: number }
        lastSyncAt: { type: [string, "null"], format: date-time }
        automationMode: { type: string, enum: [manual, automatic] }
        priceTimeoutWarning:
          oneOf:
            - $ref: "#/components/schemas/PriceTimeoutWarning"
            - type: "null"
    PriceTimeoutWarning:
      type: object
      required: [affectedProductCount, latestError]
      properties:
        affectedProductCount: { type: integer, minimum: 1 }
        latestError: { type: string }
    Product:
      type: object
      required: [id, gpayId, name, imageUrl, digisellerImageUploaded, productType, productKind, supplierPriceUsd, salePriceRub, marginPercent, isAvailable, publicationStatus, region, updatedAt]
      properties:
        id: { type: integer }
        gpayId: { type: integer }
        digisellerId: { type: [integer, "null"] }
        platiCategoryId: { type: [integer, "null"] }
        appId: { type: [integer, "null"] }
        subId: { type: [integer, "null"] }
        name: { type: string }
        imageUrl: { type: [string, "null"] }
        digisellerImageUploaded: { type: boolean }
        productType: { type: string }
        productKind: { type: string, enum: [key, gift, unknown] }
        supplierPriceUsd: { type: number }
        salePriceRub: { type: number }
        marginPercent: { type: number }
        profitRub: { type: number }
        isAvailable: { type: boolean }
        publicationStatus: { type: string, enum: [draft, publishing, published, paused, error] }
        publicationError: { type: [string, "null"] }
        publicationFailureStage: { type: [string, "null"], enum: [category, image, stock, uncertain, null] }
        region: { type: string }
        warningMessage: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    ProductUpdate:
      type: object
      properties:
        marginPercent: { type: number, minimum: 0, maximum: 500 }
        publicationStatus: { type: string, enum: [draft, published, paused] }
        platiCategoryId: { type: [integer, "null"], minimum: 1 }
    BatchPublishInput:
      type: object
      required: [productIds]
      properties:
        productIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        regenerateImages:
          type: boolean
          default: false
          description: Sequentially generate and replace images on existing published cards.
    PublishProductInput:
      type: object
      properties:
        regenerateImage:
          type: boolean
          default: false
          description: Force a new image upload for an existing Digiseller card.
    BatchPublishItem:
      type: object
      required: [productId, name, status, imageStatus]
      properties:
        productId: { type: integer }
        name: { type: string }
        operation: { type: string, enum: [publish, regenerateImage] }
        status: { type: string, enum: [queued, publishing, published, failed] }
        digisellerId: { type: [integer, "null"] }
        imageStatus: { type: string, enum: [uploaded, skipped, failed] }
        error: { type: [string, "null"] }
    BatchPublishResult:
      type: object
      required: [requested, succeeded, failed, items]
      properties:
        requested: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/BatchPublishItem" }
    BatchPublishTask:
      allOf:
        - $ref: "#/components/schemas/BatchPublishResult"
        - type: object
          required: [taskId, status, createdAt, updatedAt]
          properties:
            taskId: { type: string, format: uuid }
            status: { type: string, enum: [queued, running, completed] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            completedAt: { type: [string, "null"], format: date-time }
    CatalogSyncInput:
      type: object
      required: [pageSize]
      properties:
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 100 }
        availableOnly: { type: boolean, default: true }
        productKind: { type: string, enum: [all, key, gift], default: all }
    SyncResult:
      type: object
      required: [success, imported, updated, disabled, message, completedAt]
      properties:
        success: { type: boolean }
        imported: { type: integer }
        updated: { type: integer }
        disabled: { type: integer }
        productKind: { type: string, enum: [all, key, gift] }
        message: { type: string }
        completedAt: { type: string, format: date-time }
    DigisellerProduct:
      type: object
      required: [id, name, priceRub, visible, inStock, numInStock, linkedProductId]
      properties:
        id: { type: integer }
        name: { type: string }
        priceRub: { type: number }
        visible: { type: boolean }
        inStock: { type: boolean }
        numInStock: { type: [integer, "null"] }
        linkedProductId: { type: [integer, "null"] }
    DigisellerProductList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DigisellerProduct" }
        total: { type: integer }
    DigisellerProductLinkInput:
      type: object
      required: [localProductId, digisellerId, deliveryType]
      properties:
        localProductId: { type: integer, minimum: 1 }
        digisellerId: { type: integer, minimum: 1 }
        deliveryType: { type: string, enum: [code, text, form] }
    Activity:
      type: object
      required: [id, type, title, description, status, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [sync, price, publish, connection, category] }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [success, warning, error] }
        createdAt: { type: string, format: date-time }
    Settings:
      type: object
      required: [defaultMarginPercent, usdRubRate, exchangeRateMode, conversionMarkupPercent, digisellerFeePercent, fixedReserveRub, minimumProfitRub, automationMode, disableOnUnavailable, digisellerChatCodeEnabled, digisellerThankYouPromoEnabled, customerSiteUrl, credentialsConfigured, notificationConfigured, autonomousPaused, autonomousAllowlist, launchPreflightAt, launchOrderConfirmedAt, imageProvider]
      properties:
        defaultMarginPercent: { type: number }
        usdRubRate: { type: number }
        exchangeRateMode: { type: string, enum: [cbr, manual] }
        conversionMarkupPercent: { type: number }
        digisellerFeePercent: { type: number }
        fixedReserveRub: { type: number }
        minimumProfitRub: { type: number }
        automationMode: { type: string, enum: [manual, automatic] }
        disableOnUnavailable: { type: boolean }
        digisellerChatCodeEnabled: { type: boolean }
        digisellerThankYouPromoEnabled:
          type: boolean
          description: Enable Digiseller's native 5% gift certificate after a positive review.
        customerSiteUrl: { type: [string, "null"], format: uri }
        credentialsConfigured: { type: boolean }
        notificationConfigured: { type: boolean }
        autonomousPaused: { type: boolean }
        autonomousAllowlist:
          type: array
          items: { type: integer, minimum: 1 }
        launchPreflightAt: { type: [string, "null"], format: date-time }
